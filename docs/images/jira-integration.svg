<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">GitHub와 Jira 연동 구조</title>
  <desc id="description">web, server, ai 저장소의 이슈와 PR 이벤트를 bareum-ops가 받아 Jira BRM 티켓을 생성하거나 갱신합니다. 동기화 실패 시 Discord로 알림을 보냅니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 L6 4.5 L2 8" fill="none" stroke="#92999f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      .heading { font-size: 23px; font-weight: 400; fill: #383b3e; text-anchor: middle; }
      .node { font-size: 24px; font-weight: 600; fill: #25282b; text-anchor: middle; }
      .label { font-size: 20px; font-weight: 500; fill: #2680eb; text-anchor: middle; }
      .edge { fill: none; stroke: #92999f; stroke-width: 1.6; marker-end: url(#arrow); }
      .pill { fill: #fff; stroke: #2680eb; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1600" height="460" rx="16" fill="#fff"/>

  <!-- Pastel areas and rounded component cards. -->
  <rect x="40" y="94" width="322" height="180" fill="#fff8ed" stroke="#d8cbb8" stroke-width="1.6"/>
  <text class="heading" x="201" y="125">GitHub</text>
  <rect x="59" y="147" width="284" height="106" rx="26" fill="#fff8ed" stroke="#d8cbb8" stroke-width="1.6"/>
  <text class="node" x="201" y="196">web · server · ai</text>
  <text class="node" x="201" y="224">이슈·PR</text>

  <rect x="650" y="94" width="296" height="180" fill="#edf4fb" stroke="#b4cde8" stroke-width="1.6"/>
  <text class="heading" x="798" y="125">공통 자동화</text>
  <rect x="670" y="147" width="256" height="106" rx="26" fill="#edf4fb" stroke="#b4cde8" stroke-width="1.6"/>
  <text class="node" x="798" y="208">bareum-ops</text>

  <rect x="1260" y="94" width="292" height="180" fill="#eef7ed" stroke="#b8d2b5" stroke-width="1.6"/>
  <text class="heading" x="1406" y="125">Jira</text>
  <rect x="1280" y="147" width="252" height="106" rx="26" fill="#eef7ed" stroke="#b8d2b5" stroke-width="1.6"/>
  <text class="node" x="1406" y="208">BRM 티켓</text>

  <rect x="1260" y="327" width="292" height="100" rx="26" fill="#f4f1fa" stroke="#c8bde1" stroke-width="1.6"/>
  <text class="node" x="1406" y="386">Discord 알림</text>

  <!-- Routes remain behind the labels, with clear spacing around every card. -->
  <path class="edge" d="M343 200 H660"/>
  <path class="edge" d="M926 200 H1270"/>
  <path class="edge" d="M926 232 H982 Q998 232 998 248 V361 Q998 377 1014 377 H1250" stroke-dasharray="4 4"/>

  <rect class="pill" x="413" y="178" width="180" height="44" rx="22"/>
  <text class="label" x="503" y="207">이슈·PR 이벤트</text>

  <rect class="pill" x="1009" y="178" width="180" height="44" rx="22"/>
  <text class="label" x="1099" y="207">티켓 생성·갱신</text>

  <rect class="pill" x="1065" y="355" width="106" height="44" rx="22"/>
  <text class="label" x="1118" y="384">실패 시</text>
</svg>
